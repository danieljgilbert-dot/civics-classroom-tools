<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bill of Rights — Selection Board</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#f5f7fb;background:#101827}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh}.wrap{max-width:1450px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}h1{font-size:clamp(28px,3vw,46px);margin:0}p{line-height:1.4}.sub{color:#b9c8da;margin:8px 0 0}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{border:2px solid #4a6687;background:#1b2c43;border-radius:16px;color:white;text-align:left;padding:22px;min-height:178px;cursor:pointer;position:relative}.tile:hover:not(:disabled),.tile:focus-visible{border-color:#f9c66a;background:#243c5b}.tile:disabled{cursor:default;background:#222b37;border-color:#46505c}.letter{display:inline-block;font-size:24px;font-weight:800;background:#f9c66a;color:#101827;border-radius:8px;padding:4px 11px;margin-right:10px}.heading{font-size:23px;font-weight:750}.desc{font-size:18px;margin-top:13px;line-height:1.4}.taken{position:absolute;inset:0;background:#0b101bdc;display:flex;align-items:center;justify-content:center;border-radius:14px;color:#ffca7c;font-size:clamp(32px,4vw,56px);font-weight:900;letter-spacing:4px;transform:rotate(-4deg)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button.action{font-size:18px;font-weight:700;border:0;border-radius:10px;padding:14px 19px;cursor:pointer;background:#f9c66a;color:#111827}button.secondary{background:#334963;color:white}button.danger{background:#70333b;color:white}button:focus-visible{outline:4px solid white;outline-offset:3px}.hidden{display:none!important}.reveal{max-width:1000px;margin:8vh auto 0;text-align:center;background:#1b2c43;border:2px solid #56749b;border-radius:20px;padding:48px}.reveal .tag{color:#f9c66a;font-size:26px;font-weight:800}.reveal h2{font-size:clamp(46px,7vw,88px);margin:18px 0}.reveal h3{font-size:clamp(25px,3vw,40px);margin:0}.reveal p{font-size:clamp(19px,2.2vw,27px);max-width:820px;margin:28px auto 38px}.reveal .controls{justify-content:center}.status{font-weight:700;color:#f9c66a}.hint{font-size:15px;color:#b9c8da;margin-top:20px}@media(max-width:850px){.board{grid-template-columns:repeat(2,1fr)}.tile{min-height:175px}}@media(max-width:580px){body{padding:12px}.board{grid-template-columns:1fr}.tile{min-height:120px;padding:15px}.desc{font-size:16px}.heading{font-size:19px}.reveal{padding:22px;margin-top:30px}}</style></head><body><main class="wrap"><section id="boardView"><header><div><h1>Bill of Rights — Choose Your Protection</h1><p class="sub">Select one description to reveal the amendment. Each selection can be claimed once.</p></div><div class="controls"><span class="status" id="count"></span><button class="action secondary" id="fullscreen">Full Screen</button><button class="action danger" id="reset">Reset Board</button></div></header><div id="board" class="board"></div><p class="hint">Selections remain marked while this page stays open. Reset between classes. Refreshing the page will also reset the board.</p></section><section id="revealView" class="reveal hidden" aria-live="polite"><div class="tag" id="revealLetter"></div><h2 id="revealAmendment"></h2><h3 id="revealTitle"></h3><p id="revealDesc"></p><div class="controls"><button class="action" id="confirm">Confirm Selection &amp; Return</button><button class="action secondary" id="cancel">Back Without Selecting</button></div></section></main><script>const data=[{letter:'A',title:'Freedom & Expression',description:'Protects your ability to express ideas, practice beliefs, gather with others, and challenge the government.',amendment:'1st Amendment'},{letter:'B',title:'Personal Protection',description:'Protects a right connected to weapons and personal or collective defense.',amendment:'2nd Amendment'},{letter:'C',title:'Privacy',description:'Protects people and their property from unreasonable government searches and seizures.',amendment:'4th Amendment'},{letter:'D',title:'Rights of the Accused',description:'Protects people against being forced to testify against themselves, being tried twice for the same crime, or losing life, liberty, or property without due process.',amendment:'5th Amendment'},{letter:'E',title:'Fair Criminal Trial',description:'Protects the right to a speedy and public trial, an impartial jury, witnesses, and legal counsel.',amendment:'6th Amendment'},{letter:'F',title:'Civil Court',description:'Protects the right to a jury in certain lawsuits between individuals or organizations.',amendment:'7th Amendment'},{letter:'G',title:'Punishment & Bail',description:'Protects against excessive bail, excessive fines, and cruel and unusual punishment.',amendment:'8th Amendment'}];const taken=new Set();let active=null;const el=id=>document.getElementById(id);function render(){el('board').replaceChildren();for(const item of data){const b=document.createElement('button');b.className='tile';b.disabled=taken.has(item.letter);b.innerHTML=`<div><span class="letter">${item.letter}</span><span class="heading">${item.title}</span></div><div class="desc">${item.description}</div>${taken.has(item.letter)?'<div class="taken">TAKEN</div>':''}`;b.onclick=()=>open(item);el('board').append(b)}el('count').textContent=`${taken.size} of 7 selected`;}function open(item){active=item;el('revealLetter').textContent=`Choice ${item.letter}`;el('revealAmendment').textContent=item.amendment;el('revealTitle').textContent=item.title;el('revealDesc').textContent=item.description;el('boardView').classList.add('hidden');el('revealView').classList.remove('hidden')}function back(){active=null;el('revealView').classList.add('hidden');el('boardView').classList.remove('hidden');render()}el('confirm').onclick=()=>{if(active)taken.add(active.letter);back()};el('cancel').onclick=back;el('reset').onclick=()=>{if(confirm('Clear all selections and start a new class?')){taken.clear();render()}};el('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};render();</script></body></html>
